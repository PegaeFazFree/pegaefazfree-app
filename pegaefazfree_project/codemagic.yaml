workflows:
  ios-unsigned-check:
    name: PegaeFazFree iOS - Build de validação
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter doctor
        script: flutter doctor -v
      - name: Dependências Flutter
        script: flutter pub get
      - name: Validar projeto iOS
        script: flutter build ios --config-only --release
      - name: Build iOS sem assinatura
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
